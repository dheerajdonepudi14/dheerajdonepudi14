<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Animated Parrot OS style cybersecurity terminal for Dheeraj Donepudi">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#020405"/></linearGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop stop-color="#172522"/><stop offset="1" stop-color="#0a100f"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#00ff9c"/><stop offset="1" stop-color="#39ffda"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00ff9c" stroke-opacity=".045"/></pattern>
  <clipPath id="screen"><rect x="30" y="80" width="1140" height="510" rx="14"/></clipPath>
</defs>
<rect width="1200" height="620" rx="22" fill="#020504"/>
<rect x="20" y="20" width="1160" height="580" rx="18" fill="url(#bg)" stroke="#24433a" stroke-width="2"/>
<rect x="20" y="20" width="1160" height="58" rx="18" fill="url(#bar)"/>
<circle cx="52" cy="49" r="9" fill="#ff5f56"/><circle cx="80" cy="49" r="9" fill="#ffbd2e"/><circle cx="108" cy="49" r="9" fill="#27c93f"/>
